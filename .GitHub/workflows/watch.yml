name: check-codes
on: {schedule: [{cron: "*/15 * * * *"}], workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python bot.py --once
        env: {SMTP_HOST: "${{ secrets.SMTP_HOST }}", SMTP_PORT: "${{ secrets.SMTP_PORT }}", SMTP_USER: "${{ secrets.SMTP_USER }}", SMTP_PASSWORD: "${{ secrets.SMTP_PASSWORD }}", EMAIL_FROM: "${{ secrets.EMAIL_FROM }}", EMAIL_TO: "${{ secrets.EMAIL_TO }}"}
      - run: git config user.email "bot@users.noreply.github.com" && git config user.name "code-watcher" && git add seen.json && (git commit -m "update seen.json" || echo "nothing to commit") && git push
